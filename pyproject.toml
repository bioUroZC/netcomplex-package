[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netcomplex"
version = "0.3.0"
description = "Protein-complex activity scoring with rank-based network propagation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Zihao Chen", email = "xiaoinsland@gmail.com" }]
keywords = ["bioinformatics", "proteomics", "network", "protein complex", "random walk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.21", "pandas>=1.3", "scipy>=1.7"]

[project.urls]
Homepage = "https://pypi.org/project/netComplex/"

[project.scripts]
netcomplex = "netcomplex.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netcomplex = ["examples/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
